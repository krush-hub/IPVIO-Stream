name: Baseline Profile

# Generates the Baseline Profile for the NexTV app on an emulator and commits it back.
# Manual run only (workflow_dispatch). The repo is public, so GitHub Actions is free.
# The profile covers app start until the first frame: on the emulator the app opens on
# the login screen (no playlist), which is exactly the cold-start path.

on:
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: "Also run the startup benchmark (before/after numbers)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # The release build needs the signing config (same as the release workflow).
      - name: Write signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Refusing to build an unsigned release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ipvio-release.jks
          printf 'storeFile=ipvio-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Generate Baseline Profile on emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 50
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon :app:generateBaselineProfile
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Show generated profile
        run: |
          find app/src baselineprofile -name "baseline-prof.txt" 2>/dev/null
          wc -l app/src/*/generated/baselineProfiles/baseline-prof.txt 2>/dev/null || true
          git status --short

      - name: Commit profile back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/src/*/generated/baselineProfiles/baseline-prof.txt app/src/main/baseline-prof.txt
          if git diff --cached --quiet; then echo "::error::No profile was generated."; exit 1; fi
          git commit -m "Baseline profile (generated on emulator, CI)"
          git push

      # Startup benchmark, before/after numbers — runs after the profile was generated,
      # so the "with profile" run uses the fresh profile.
      - name: Startup benchmark (before/after)
        if: ${{ inputs.run_benchmark }}
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 50
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon :baselineprofile:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nextv.baselineprofile.StartupBenchmarks
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
