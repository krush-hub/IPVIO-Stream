          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"


      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "v${{ steps.version.outputs.name }}" >/dev/null 2>&1; then
            echo "::error::Release v${{ steps.version.outputs.name }} already exists. Raise versionName in app/build.gradle.kts."
            exit 1
          fi


      # Signing secrets are required. Without them the APK would be unsigned and users could not update.
      - name: Write signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Refusing to publish an unsigned release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ipvio-release.jks
          printf 'storeFile=ipvio-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties


      - name: Build signed release APK
        # Google sign-in for Drive and live sync: without these the release hides the Drive section (see app/build.gradle.kts)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: ./gradlew --no-daemon assembleRelease


      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::$APK not found"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"


      - name: Create NexTV.apk and update.json
        run: |
          cp app/build/outputs/apk/release/app-release.apk NexTV.apk
          SHA=$(sha256sum NexTV.apk | cut -d' ' -f1)
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "apk": "NexTV.apk",\n  "sha256": "%s",\n  "minSupportedCode": 0,\n  "mandatory": false\n}\n' \
            "${{ steps.version.outputs.code }}" "${{ steps.version.outputs.name }}" "$SHA" > update.json
          # Update dialog text: the first four highlight lines of the release notes, max 300 characters (Round17Logic.kt)
          NOTES_FILE="docs/release-notes/v${{ steps.version.outputs.name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTE=$(awk 'NF && !/^[[:space:]]*#/ { sub(/^[[:space:]]*[-*][[:space:]]+/, ""); print; if (++n == 4) exit }' "$NOTES_FILE" | paste -sd'\t' | sed 's/\t/ · /g')
            jq --arg n "$NOTE" '. + {notes: ($n | .[0:300])}' update.json > update.tmp && mv update.tmp update.json
          fi
          cat update.json


      # Release text: docs/release-notes/v<versionName>.md if it exists (CLAUDE.md section 18), otherwise GitHub's PR list
      - name: Publish GitHub release
        run: |
          NOTES_FILE="docs/release-notes/v${{ steps.version.outputs.name }}.md"
          if [ -f "$NOTES_FILE" ]; then NOTES_ARGS=(--notes-file "$NOTES_FILE"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "v${{ steps.version.outputs.name }}" NexTV.apk update.json \
            --target "$GITHUB_SHA" \
            --title "NexTV ${{ steps.version.outputs.name }}" \
            "${NOTES_ARGS[@]}"

